# MiniMax-H3 proxy-to-video with the proxy on a ControlNet trunk.
#
# Why this exists. Every other scenario here feeds the proxy through H3's Ref2VA reference slot, and
# that slot cannot express a per-token constraint. H3 packs references *ahead* of the target, so the
# proxy sits a whole clip earlier in RoPE time -- 206.667 units at 124 frames -- and no proxy frame
# ever shares a temporal position with the target frame it is meant to steer. It also sits at a
# quarter of the target's resolution. What reaches the sampler is therefore a piece of content the
# model reads once and decides how much to believe, which is enough for layout and rough heading and
# not enough for rate: the LoRA runs on that pathway put out predictions that turn the right way at
# the wrong speed, and their coherent drift collapsed to the random-walk floor by step 150.
#
# The trunk is the alternative reading of the same pixels. `fastvideo/models/dits/
# minimax_h3_camera_controlnet.py` adds a zero-initialised residual into the backbone's stream every
# `controlnet_layer_stride` blocks, at the exact row the signal belongs to, over the target's own
# latent grid. Nothing about the proxy changes; where it is allowed to act does.
#
# The reference slot keeps the proxy anyway. The cached text embedding was tokenized around
# `<Picture 1>` then `<Video 1>`, and the CWM system prompt spends most of its length telling the
# model what `<Video 1>` is for. Removing it would invalidate every cached text embedding and
# contradict a prompt this repo otherwise reproduces byte-for-byte. So the proxy is presented twice:
# once as content the text can refer to, once as a constraint the trunk can enforce.
#
# --- what has to be true of the cache -------------------------------------------------------------
#
# Nothing extra is cached. The trunk reads the same `proxy_latent` the reference prefix reads, and
# replicates it onto the target's latent grid: the VAE's stride of 16 means proxy latent cell
# `(i, j)` covers the same pixels as target cells `(4i..4i+3, 4j..4j+3)`, so copying each cell over
# that block puts it exactly where the pixels it describes ended up.
#
# Replicating latents rather than re-encoding blown-up pixels is deliberate, and not only cheaper.
# The two differ -- the VAE is not linear -- but only in that encoding blown-up pixels also encodes
# the block edges the blow-up introduced, which is an artifact and not scene detail. Neither route
# adds detail the reference did not have; what either adds is a position at which the signal can
# act. And this tensor is read by a freshly initialised linear and never decoded, so there is no
# reason for it to look like something the VAE would have produced.
#
# What *does* have to hold is that the target latent grid is an integer multiple of the proxy's.
# Otherwise one proxy cell spreads over a fractional number of target cells and the registration
# varies across the frame. At the released geometries it divides exactly: 48/12 == 84/21 == 4.
#
# That is the one reason to re-encode, and it is a variable worth clearing anyway. `gta_v2_cwm` was
# written at 704x1280 -- latent 44 x 80, which is 3.67x by 3.81x of the proxy's 12 x 21 -- while
# CWM's released geometry is 768x1344. So the canvas deviation these GTA runs carried is also what
# blocks replication, and one plain encode fixes both:
#
#   python scripts/h3_proxy/prepare_data/encode_proxy_samples.py \
#       --manifest /data/binghe/h3_proxy/gta_v2_cwm_encode.jsonl \
#       --root /data/binghe/datasets/gta_web_0902_v2/gta_web_0902 \
#       --output /data/binghe/h3_proxy/cache/gta_v2_ctrl \
#       --model-path /data/models/MiniMax-H3 \
#       --num-frames 124 --height 768 --width 1344 \
#       --proxy-height 192 --proxy-width 336 \
#       --anchor-short-edge 2048 --cwm-system w0
#
# `cache/gta_v2_train` is already 768x1344 over a 192x336 proxy, so it can drive the trunk with no
# encoding at all. Its DUV predates the CWM depth range and palette, which makes it the wrong
# baseline but a fine smoke test of the plumbing.
#
# --- what is deliberately held fixed --------------------------------------------------------------
#
# `num_given_latent_frames: 1`. The `wn` regime -- CWM's 10 clean latent frames of prefix -- is the
# other live hypothesis for the rate problem, and it pins rate by handing the model 1.4 seconds of
# real motion. Turning both on at once means a result that cannot be attributed. This run is w0, so
# it reads directly against the w0 LoRA baseline whose drift-to-noise numbers we already have.
#
# `camera_dropout: 0.0`. Dropout drops the whole trunk, and here the trunk is the only per-token
# route the proxy has; dropping it would train the model to ignore the thing being tested. The
# plugin rejects a nonzero value together with enable_control_proxy rather than letting it through.
#
# `enable_control_camera: false`. The trunk's other modality is the Plücker ray field of a requested
# trajectory. The GTA capture ships no extrinsics, so there is nothing to build one from -- and if a
# trajectory ever does arrive, that modality is the more direct fix for camera control than a proxy
# is, since it states the pose instead of implying it.
#
# Then launch (2 nodes of 8). Probe memory at one step before committing: the trunk attends over the
# whole packed sequence, ~56k rows, at 25 injection points, so headroom is not what the LoRA runs
# had.
#   torchrun --nnodes 2 --nproc_per_node 8 -m fastvideo.train.entrypoint.train \
#       --config examples/train/scenario/h3_proxy/proxy_controlnet_finetune.yaml

models:
  student:
    _target_: fastvideo.train.models.minimax_h3.MiniMaxH3ProxyModel
    # Must contain transformer_ref/: this plugin loads the Ref2VA partition, not the T2VA one.
    init_from: /data/models/MiniMax-H3
    trainable: true
    enable_gradient_checkpointing_type: full
    attention_backend: TORCH_SDPA

    # --- control trunk ---
    enable_camera_controlnet: true
    # The proxy replicated onto the target latent grid, derived from the cached `proxy_latent`.
    enable_control_proxy: true
    # No trajectory in the GTA capture, so the Plücker modality has nothing to read. With it off the
    # trunk is a proxy ControlNet and the dataset loader stops requiring extrinsics.
    enable_control_camera: false
    controlnet_dim: 1024
    controlnet_ffn_dim: 4096
    # 1024 / 8 = 128 channels per head, which clears the 96 the H3 rotary table rotates. Must also
    # divide sp_size.
    controlnet_num_heads: 8
    # One control block every two backbone blocks: 25 injection points over 50 layers.
    controlnet_layer_stride: 2
    # See the header. Nonzero is rejected alongside enable_control_proxy.
    camera_dropout: 0.0

    # Trunk only. The residual is zero-initialised, so step 0 reproduces the released model exactly
    # and anything the panel shows afterwards is the trunk's doing -- which is the whole point of
    # running this against the LoRA baseline rather than alongside it. The alternative is
    # freeze_backbone: false with the `lora` block from proxy_bd_finetune_abot.yaml, training both;
    # do that only after the trunk alone has been read, or the attribution is gone again.
    freeze_backbone: true

    # --- reference conditioning ---
    # Anchor first, proxy second: the cached text embedding was tokenized around `<Picture 1>` then
    # `<Video 1>`, so this has to match how the data was encoded.
    enable_anchor: true
    # Held at the w0 contract. See the header on why this is not 10 here.
    num_given_latent_frames: 1
    # Game footage is silent; supervising the audio head against placeholder latents would train it
    # towards silence for no benefit.
    supervise_audio: false

method:
  _target_: fastvideo.train.methods.fine_tuning.finetune.FineTuneMethod

training:
  distributed:
    # 2 nodes of 8. These are not free knobs:
    #   nnodes * nproc_per_node == num_gpus == hsdp_replicate_dim * hsdp_shard_dim
    num_gpus: 16
    # Probe this. sp_size 2 gives 8 data-parallel replicas, which reaches global batch 32 with the
    # least accumulation, but the trunk's activations are new memory the LoRA runs did not carry --
    # and replication means it carries a full target-grid control signal, not a quarter-res one. If
    # a single step OOMs, go to 4 and halve gradient_accumulation_steps to hold the global batch.
    sp_size: 2
    tp_size: 1
    hsdp_replicate_dim: 1
    hsdp_shard_dim: 16
    pin_cpu_memory: true

  data:
    # The target latent grid must be an integer multiple of the proxy's, which at 768x1344 over a
    # 192x336 proxy is 4x. `scripts/h3_proxy/describe_cache.py` prints both geometries.
    data_path: /data/binghe/h3_proxy/cache/gta_v2_ctrl
    # Unused by this plugin's cached-sample loader, but the shared data config still validates it.
    preprocessed_data_type: t2va
    dataloader_num_workers: 2
    # Both are contracts, not tuning knobs: packed row indices carry no batch offset, and H3 has no
    # zero-embedding branch for text CFG.
    train_batch_size: 1
    training_cfg_rate: 0.0
    seed: 42
    num_frames: 124
    num_latent_t: 37
    # CWM's released geometry, and the only canvas the proxy grid divides. See the header.
    num_height: 768
    num_width: 1344

  optimizer:
    # A from-scratch trunk in front of a frozen backbone tolerates -- and needs -- more than the
    # 2e-5 a LoRA finetune of the backbone would use.
    learning_rate: 1.0e-4
    betas: [0.9, 0.999]
    weight_decay: 0.0
    lr_scheduler: constant_with_warmup
    # A quarter of a 600-step run would be a warmup, so this is sized to the run and not to CWM's.
    lr_warmup_steps: 25

  loop:
    max_train_steps: 600
    # global batch = (num_gpus / sp_size) * train_batch_size * this = 8 * 1 * 4 = 32.
    gradient_accumulation_steps: 4

  checkpoint:
    # Absolute, and on the data disk: a relative path resolves against the checked-out repo under
    # `/workspace`, which does not outlive the node, and the validation mp4s land here too.
    output_dir: /data/binghe/h3_proxy/runs/gta_v2_ctrl/checkpoints
    # Frequent, because the question this run answers is whether coherent drift leaves the
    # random-walk floor -- and that is read from checkpoint pairs, not from the loss curve.
    training_state_checkpointing_steps: 25
    checkpoints_total_limit: 20
    resume_from_checkpoint: ""

  tracker:
    trackers: [wandb]
    project_name: fastvideo_h3_proxy
    run_name: gta_v2_proxy_controlnet

  model:
    precondition_outputs: false
    enable_gradient_checkpointing_type: full

  dit_precision: bf16

callbacks:
  grad_clip:
    _target_: fastvideo.train.callbacks.grad_clip.GradNormClipCallback
    max_grad_norm: 1.0

  # Declared but never scheduled. `every_steps: 0` returns from `on_validation_begin` on its first
  # line, so this run never samples in-process -- in-loop sampling hands the FSDP-wrapped training
  # transformer to an inference pipeline that also holds a second text encoder and VAE, and this run
  # is reading a from-scratch trunk where that is not worth the interaction.
  #
  # It is still declared, because the offline path overrides these rather than supplying them: it
  # reads the config saved in the checkpoint and turns the schedule back on. Deleting the block
  # would take the geometry and the validation set with it.
  #
  #   scripts/h3_proxy/eval_checkpoint.sh --step <N> \
  #       --run /data/binghe/h3_proxy/runs/gta_v2_ctrl/checkpoints \
  #       --cache /data/binghe/h3_proxy/cache/gta_v2_ctrl \
  #       --val-json /data/binghe/h3_proxy/gta_v2_cwm_validation_val6.json \
  #       --tag ctrl
  validation:
    _target_: fastvideo.train.callbacks.minimax_h3_proxy_validation.MiniMaxH3ProxyValidationCallback
    # The Ref2VA pipeline plus the stage that turns the replicated proxy into control rows. The
    # plain Ref pipeline also builds that stage when the checkpoint has a trunk, so this names the
    # intent rather than carrying it.
    pipeline_target: fastvideo.pipelines.basic.minimax_h3.minimax_h3_pipeline.MiniMaxH3ProxyCameraPipeline
    # The same six clips the wn baseline was measured on, so the tracking numbers are about the
    # same content. A validation set is mp4 paths and captions, so it carries no canvas of its own
    # and is reusable across geometries -- the callback re-derives conditioning at the run's.
    dataset_file: /data/binghe/h3_proxy/gta_v2_cwm_validation_val6.json
    # See above: zero is "never", and eval_checkpoint.sh overrides both.
    every_steps: 0
    run_at_start: false
    sampling_steps: [50]
    # H3 has no zero-embedding branch for text CFG, matching training_cfg_rate: 0.0 above.
    guidance_scale: 1.0
    num_frames: 124
    # H3 packs one document per request.
    num_videos_per_prompt: 1
    # Required: this callback conditions through an ordered reference list, and image_path would
    # present the proxy a second time. The callback rejects true rather than silently doubling it.
    use_validation_media_conditioning: false
    # Must equal the --anchor-short-edge used by encode_proxy_samples.py.
    anchor_short_edge: 2048
    # Must equal the encoder's --proxy-height/--proxy-width. These also set the grid the trunk
    # replicates from, so a mismatch here changes the control signal and not just the reference.
    proxy_height: 192
    proxy_width: 336
    # Must match encode_proxy_samples --cwm-system.
    cwm_system_prompt: w0
    # Must match `models.student.num_given_latent_frames` above, and `cwm_system_prompt`.
    num_given_latent_frames: 1
    # Panel canvas height. Three 768-tall panels is a ~4000x800 artifact per clip; 384 halves each
    # edge and still shows whether the output tracks the proxy.
    panel_height: 384
    # A validation pipeline holds a second text encoder and VAE alongside the training state.
    offload_training_state: true
    unload_pipeline_after_validation: true
    text_encoder_cpu_offload: true
    vae_cpu_offload: true

pipeline: {}
