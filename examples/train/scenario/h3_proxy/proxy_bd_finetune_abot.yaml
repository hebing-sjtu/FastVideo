# MiniMax-H3 proxy-to-video on ABot-sub-2000-clips. Same stage as `proxy_bd_finetune.yaml`; only
# the data plumbing differs. Read that file for why the hyperparameters are what they are.
#
# What is different about this dataset:
#
#   * The proxy arrives as a pre-composed DUV video (336x192, lossless), not as per-frame
#     `.depth.f32` + `.semantic_id.png`. It is passed through unconverted, so its channels carry the
#     delivery convention -- log depth over 0.1 m to 8000 m rising away from the camera, 255 as a
#     sky sentinel, class codes in green and blue -- rather than the one `proxy.py` would write.
#     That is fine here and only here: this stage starts from the base Ref2VA checkpoint, which has
#     no DUV prior of any kind, so the meaning of those channels is learned from scratch. It does
#     mean sampling has to present the same convention, which is why validation reads the same
#     duv.mp4 files rather than anything re-encoded.
#   * The anchor is a lossless `target/anchor.png`, not frame 0 of the lossy target mp4.
#   * There are no camera trajectories to use. The dataset ships COLMAP poses, but they are sparse
#     (fewer than 124) and non-metric, so they cannot be mixed with the metric depth in the DUV.
#     `proxy_camera_finetune.yaml` stays out of reach until that scale factor is solved.
#   * There is no per-clip text. See the prompt note on `data_path` below.
#
# Build the manifests and cache, holding out whole episodes:
#   python scripts/h3_proxy/prepare_data/clip_dir_to_encode_manifest.py \
#       --root /data/binghe/datasets/ABot-sub-2000-clips \
#       --split train --val-episodes 24 --out /data/binghe/h3_proxy/abot_train.jsonl
#   python scripts/h3_proxy/prepare_data/encode_proxy_samples.py \
#       --manifest /data/binghe/h3_proxy/abot_train.jsonl \
#       --root /data/binghe/datasets/ABot-sub-2000-clips \
#       --output /data/binghe/h3_proxy/cache/abot_train --model-path /workspace/models/MiniMax-H3 \
#       --num-frames 124 --height 768 --width 1344 --anchor-short-edge 768
#
# Every path this file writes to is on the `/data/binghe` disk, not under `/workspace`. The cache is
# hours of H200 time and the checkpoints are the run itself, and `/workspace` does not outlive the
# node. Only `--model-path` reads from `/workspace`, because a snapshot is re-downloadable.
#
# Hyperparameters follow the CWM H3 recipe: rank-128 LoRA across all 50 transformer blocks starting
# from the official Ref2VA checkpoint, video loss only, AdamW with weight decay 0.01, grad-norm clip
# 1.0, BF16, gradient checkpointing, global batch size 8, 100-step warmup then cosine decay from
# 2e-5 to 1e-6.
#
# Two deliberate departures, both because this repo's H3 differs from CWM's:
#   * Trainable parameter count lands at ~665M, not CWM's ~596M. Rank 128 on q/k/v/out (5376<->7168)
#     plus the SwiGLU (5376<->28672 and 14336->5376) across 50 blocks is 665M here. The paper's
#     figure does not reproduce under any clean subset of this module decomposition -- attention
#     alone is 321M, attention plus the output projection 447M -- so this targets every projection
#     in the block, which is the closest structural reading of "throughout all 50 transformer
#     blocks". AdaLN is left out (it would add 224M); adapting the timestep modulation is not
#     standard practice and the paper's number is below the figure that would include it.
#   * FlashAttention-3 is not requested. The H3 plugin requires TORCH_SDPA, which is dense and
#     numerically equivalent, just slower.
#
# Step count is for CWM's corpus. Three epochs at global batch 8 over the 950-clip KOF train split
# is 357 steps, not 3534 -- leaving 3534 here would be ~30 epochs on that data. Set
# `max_train_steps` to `3 * ceil(num_clips / 8)` for the dataset actually in `data_path`, and note
# that a 100-step warmup is then a quarter of the run; scale it down too.
#
# Sequence length at the settings below: 37296 target rows (37 latent frames x 24 x 42 after the
# 2x2 patch) + 2442 proxy + 1008 anchor + 414 audio + text, so ~41.5k tokens.
#
# Smoke first anyway. Resolution is fixed when the cache is written, not here -- this plugin reads
# the shape off the cached latent -- so smoke by encoding a handful of clips small and pointing
# `data_path` at them:
#   --num-frames 39 --height 384 --width 672   (39 = 17*2+5, giving 12 latent frames, 3024 rows)
# then set num_frames/num_latent_t/num_height/num_width below to match.

models:
  student:
    _target_: fastvideo.train.models.minimax_h3.MiniMaxH3ProxyModel
    # Must contain transformer_ref/: this plugin loads the Ref2VA partition, not the T2VA one.
    init_from: /workspace/models/MiniMax-H3
    trainable: true
    enable_gradient_checkpointing_type: full
    attention_backend: TORCH_SDPA

    lora:
      enable: true
      rank: 128
      # alpha defaults to rank, giving scale 1.0. CWM does not state alpha.
      alpha: 128
      # Substring-matched against the full parameter path. The two text-refiner blocks, the timestep
      # MLP (also fc_in/fc_out after param_names_mapping) and the control trunk share these leaf
      # names and are held out by the arch config's exclude_lora_layers.
      target_modules: [to_q, to_k, to_v, to_out, fc_in, fc_out]

    # No trajectory in the KOF data, so there is nothing for the control trunk to read. With the
    # branch off the DiT is the released model unchanged.
    enable_camera_controlnet: false
    enable_control_depth: false
    # LoRA *is* how this stage trains the backbone, so freezing it would leave nothing to optimize.
    # The plugin rejects freeze_backbone=true together with lora.enable=true.
    freeze_backbone: false
    camera_dropout: 0.0

    # --- reference conditioning ---
    # Anchor first, proxy second: the cached text embedding was tokenized around `<Picture 1>` then
    # `<Video 1>`, so this has to match how the data was encoded.
    enable_anchor: true
    # "the audio loss is disabled" -- returning a video-only prediction is what tells the finetune
    # loss to leave the audio head alone rather than train it against placeholder silence.
    supervise_audio: false

method:
  _target_: fastvideo.train.methods.fine_tuning.finetune.FineTuneMethod

training:
  distributed:
    # Sized for one node of 8. `hsdp_replicate_dim * hsdp_shard_dim` is passed straight to
    # `init_device_mesh`, which rejects a mesh larger than the actual world size -- so these three
    # numbers are not free tuning knobs, they have to agree with torchrun's process count:
    #   nnodes * nproc_per_node == num_gpus == hsdp_replicate_dim * hsdp_shard_dim
    # For 2 nodes, set num_gpus and hsdp_shard_dim to 16 and gradient_accumulation_steps to 4.
    num_gpus: 8
    # One document per data-parallel replica. sp_size is set by sequence length, not dataset size.
    # 8 is a conservative first choice at ~41.5k tokens; lowering it trades memory headroom for
    # more data-parallel replicas, which reaches global batch 8 with less gradient accumulation and
    # so fewer forward passes per optimizer step. CWM used sp_size 1 on eight GPUs.
    sp_size: 8
    tp_size: 1
    hsdp_replicate_dim: 1
    hsdp_shard_dim: 8
    pin_cpu_memory: true

  data:
    # Written by encode_proxy_samples.py, on the persistent data disk. At ~15 MB of latents plus
    # text embeddings per clip across ~9.9k clips this is a ~150 GB artifact costing hours of H200
    # time, so it is worth keeping across nodes rather than re-deriving.
    #
    # Prompts: this dataset ships no per-clip text. `annotations/caption.json` is episode-level, so
    # it describes the whole 60 seconds rather than the 5.17 the clip covers, and the manifest
    # builder inherits it only because having some text beats having none. It is a weaker signal
    # than it looks like, but also less load-bearing than in a text-to-video run: the Qwen3-VL
    # embedding is built over the anchor and the proxy as well as the words, so the caption is one
    # of three conditioning sources rather than the only one. Writing per-clip `prompt.txt` files
    # upgrades this without touching anything here -- the builder prefers them when present.
    data_path: /data/binghe/h3_proxy/cache/abot_train
    # Unused by this plugin's cached-sample loader, but the shared data config still validates it.
    preprocessed_data_type: t2va
    dataloader_num_workers: 2
    # Both are contracts, not tuning knobs: packed row indices carry no batch offset, and H3 has no
    # zero-embedding branch for text CFG.
    train_batch_size: 1
    training_cfg_rate: 0.0
    seed: 42
    num_frames: 124
    num_latent_t: 37
    num_height: 768
    num_width: 1344

  optimizer:
    learning_rate: 2.0e-5
    betas: [0.9, 0.999]
    weight_decay: 0.01
    lr_scheduler: cosine_with_min_lr
    lr_warmup_steps: 100
    # 1e-6 / 2e-5. The scheduler floors the cosine at this ratio rather than decaying to zero.
    min_lr_ratio: 0.05

  loop:
    # 3 epochs over the ~9865 clips left after holding out 24 episodes: 3 * ceil(9865 / 8). The
    # manifest builder prints the exact figure for the split it wrote; use that rather than this.
    max_train_steps: 3702
    # global batch = (num_gpus / sp_size) * train_batch_size * this = 1 * 1 * 8 = 8.
    # sp_size equals num_gpus here, so there is a single data-parallel replica and accumulation is
    # the only thing supplying the batch. Learning rate 2e-5 is stated for global batch 8.
    gradient_accumulation_steps: 8

  checkpoint:
    # Absolute, and on the data disk. A relative path resolves against the launch directory, which
    # is the checked-out repo under `/workspace` -- so the LoRA weights, the optimizer state and the
    # validation mp4s (the callback saves media under this directory) would all go with the node.
    # This is also what `resume_from_checkpoint` has to be able to find after a restart.
    output_dir: /data/binghe/h3_proxy/runs/h3_proxy_bd_lora_abot/checkpoints
    training_state_checkpointing_steps: 250
    checkpoints_total_limit: 3
    resume_from_checkpoint: ""

  tracker:
    trackers: [wandb]
    project_name: fastvideo_h3_proxy
    run_name: h3_proxy_bd_lora_r128_abot

  model:
    precondition_outputs: false
    enable_gradient_checkpointing_type: full

  dit_precision: bf16

callbacks:
  grad_clip:
    _target_: fastvideo.train.callbacks.grad_clip.GradNormClipCallback
    max_grad_norm: 1.0

  # Logs a proxy | prediction | target panel per held-out clip, under the tracker key
  # `validation_videos_50_steps_compare`. The prediction alone is also logged, as
  # `validation_videos_50_steps`. Build `dataset_file` with:
  #   scripts/h3_proxy/prepare_data/clip_dir_to_validation_json.py \
  #       --root /data/binghe/datasets/ABot-sub-2000-clips --val-episodes 24 --limit 6 \
  #       --out /data/binghe/h3_proxy/abot_validation_val6.json
  # Pass the same --val-episodes the encode manifest used, or the two disagree on what was held out.
  #
  # Cost is the thing to watch. Each record is a full 50-step trajectory at ~41.5k tokens, so six
  # clips every 250 steps is a few percent of wall clock; every 20 steps would dominate the run.
  validation:
    _target_: fastvideo.train.callbacks.minimax_h3_proxy_validation.MiniMaxH3ProxyValidationCallback
    pipeline_target: fastvideo.pipelines.basic.minimax_h3.minimax_h3_pipeline.MiniMaxH3RefPipeline
    dataset_file: /data/binghe/h3_proxy/abot_validation_val6.json
    every_steps: 250
    run_at_start: true
    sampling_steps: [50]
    # H3 has no zero-embedding branch for text CFG, matching training_cfg_rate: 0.0 above.
    guidance_scale: 1.0
    num_frames: 124
    # H3 packs one document per request.
    num_videos_per_prompt: 1
    # Required: this callback conditions through an ordered reference list, and image_path would
    # present the proxy a second time. The callback rejects true rather than silently doubling it.
    use_validation_media_conditioning: false
    # Must equal the --anchor-short-edge used by encode_proxy_samples.py. The released default is
    # 2048, which is ~7x the anchor vision tokens this run trains on.
    anchor_short_edge: 768
    # Must equal the encoder's --proxy-height/--proxy-width. Left unset, a video reference resolves
    # its canvas from its aspect ratio, which puts this 336x192 proxy on the full 1344x768 canvas:
    # 37296 reference rows where training used 2442, from LANCZOS-upsampled frames. On a DUV that
    # upsampling also averages unrelated depth codes into values no backend ever predicted.
    proxy_height: 192
    proxy_width: 336
    # Panel canvas height. Three 768-tall panels is a ~4000x800 artifact per clip; 384 halves each
    # edge and still shows whether the output tracks the proxy. Unset uses the full height.
    panel_height: 384
    # A validation pipeline holds a second text encoder and VAE alongside the training state.
    offload_training_state: true
    unload_pipeline_after_validation: true
    text_encoder_cpu_offload: true
    vae_cpu_offload: true

pipeline: {}
