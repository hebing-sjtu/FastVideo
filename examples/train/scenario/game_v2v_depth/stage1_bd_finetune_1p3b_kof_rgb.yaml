# Stage 1 pipeline smoke on Fun-1.3B + kof_1k RGB (no depth yet).
#
# Encode with HUD crop before resize (SF3-style bars on this pack):
#   --crop-top 0.175 --crop-bottom 0.105
# Measured on 1280x720 video_src: top clears portraits+HP+timer,
# bottom clears super meters. Same fractions apply to 1344x768 targets.
#
# This pack has video_src / video_target / prompt only. ControlNet is OFF so the
# run validates: encode → dataloader → V2V channel concat → BD finetune.

models:
  student:
    _target_: fastvideo.train.models.wan.WanV2VDepthModel
    # Local disk, not the GCS mount: safetensors loads via mmap, which turns
    # a mounted read into thousands of random object fetches.
    init_from: /workspace/models/Wan2.1-Fun-1.3B-InP-Diffusers
    trainable: true
    flow_shift: 5.0
    expert: high
    enable_controlnet: false
    enable_depth: false
    freeze_backbone: false
    enable_wide_fov: false
    control_dropout: 0.1

method:
  _target_: fastvideo.train.methods.fine_tuning.finetune.FineTuneMethod

training:
  distributed:
    num_gpus: 8
    sp_size: 1
    tp_size: 1
    hsdp_replicate_dim: 1
    hsdp_shard_dim: 8

  data:
    # VAE-encoded .pt cache (not the RGB pack). Keep under /data/raw/.
    data_path: /data/raw/kof_v2v_depth/train
    dataloader_num_workers: 4
    train_batch_size: 1
    training_cfg_rate: 0.1
    seed: 42
    # 81 RGB frames → 21 latent frames for Wan VAE (4x temporal).
    num_latent_t: 21
    num_height: 480
    num_width: 832
    num_frames: 81

  optimizer:
    learning_rate: 1.0e-5
    betas: [0.9, 0.95]
    weight_decay: 0.0
    lr_scheduler: constant_with_warmup
    lr_warmup_steps: 50

  loop:
    max_train_steps: 200
    gradient_accumulation_steps: 1

  checkpoint:
    output_dir: /data/outputs/kof_1k_fun1p3b/stage1_bd_rgb_smoke
    training_state_checkpointing_steps: 100
    checkpoints_total_limit: 2

  tracker:
    project_name: kof_v2v_1p3b
    run_name: stage1_bd_rgb_smoke

  model:
    enable_gradient_checkpointing_type: full

  dit_precision: fp32

callbacks:
  grad_clip:
    _target_: fastvideo.train.callbacks.grad_clip.GradNormClipCallback
    max_grad_norm: 1.0

  validation:
    _target_: fastvideo.train.callbacks.validation.ValidationCallback
    pipeline_target: fastvideo.pipelines.basic.wan.wan_v2v_depth_pipeline.WanV2VDepthPipeline
    # Build with scripts/v2v_depth/prepare_data/kof_jsonl_to_validation_json.py.
    # crop_* live in that file and must match the encode run's crop.
    dataset_file: /data/raw/kof_1k_pre_q_060_rgb/validation_val8.json
    every_steps: 100
    run_at_start: true
    sampling_steps: [30]
    num_frames: 81
    guidance_scale: 5.0
    # The source clip is the conditioning signal; the callback must not also
    # treat its first frame as an image-to-video prompt.
    use_validation_media_conditioning: false
    # A 1.3B pipeline plus optimizer state does not fit twice on one card.
    offload_training_state: true
    unload_pipeline_after_validation: true
    metrics:
      enabled: true
      names:
        - vbench.imaging_quality
        - vbench.aesthetic_quality
        - vbench.subject_consistency
        - vbench.background_consistency
      skip_missing_deps: true
      strict: false
      unload_after_validation: true

pipeline:
  flow_shift: 5
