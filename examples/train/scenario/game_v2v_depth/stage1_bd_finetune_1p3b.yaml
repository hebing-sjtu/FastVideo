# Stage 1 (BD) on Wan2.1-Fun-1.3B-InP — smoke / debug before A14B.
#
# Why Fun-InP and not Wan2.1-T2V-1.3B: V2V fills Wan's I2V conditioning slot
# (noise | mask | condition). T2V only has 16 input channels and cannot carry
# the source clip without changing the backbone. Fun-1.3B-InP is the 1.3B I2V
# checkpoint registered in this repo.
#
# 1.3B has a single expert (no MoE); leave `expert: high` (loads `transformer`).

models:
  student:
    _target_: fastvideo.train.models.wan.WanV2VDepthModel
    init_from: weizhou03/Wan2.1-Fun-1.3B-InP-Diffusers
    trainable: true
    flow_shift: 5.0
    expert: high
    enable_controlnet: true
    enable_depth: true
    # Narrower than the A14B defaults: 1.3B trunk dim is 1536.
    controlnet_dim: 512
    controlnet_ffn_dim: 2048
    controlnet_num_heads: 8
    controlnet_layer_stride: 2
    freeze_backbone: true
    enable_wide_fov: false
    control_dropout: 0.1

method:
  _target_: fastvideo.train.methods.fine_tuning.finetune.FineTuneMethod

training:
  distributed:
    num_gpus: 8
    sp_size: 1
    tp_size: 1
    hsdp_replicate_dim: 1
    hsdp_shard_dim: 8

  data:
    data_path:
      data/game_v2v_depth/train: 1
    dataloader_num_workers: 4
    train_batch_size: 1
    training_cfg_rate: 0.1
    seed: 42
    num_latent_t: 21
    num_height: 480
    num_width: 832
    num_frames: 81

  optimizer:
    learning_rate: 1.0e-4
    betas: [0.9, 0.95]
    weight_decay: 0.0
    lr_scheduler: constant_with_warmup
    lr_warmup_steps: 100

  loop:
    max_train_steps: 5000
    gradient_accumulation_steps: 1

  checkpoint:
    output_dir: outputs/game_v2v_depth_1p3b/stage1_bd
    training_state_checkpointing_steps: 500
    checkpoints_total_limit: 3

  tracker:
    project_name: game_v2v_depth_1p3b
    run_name: stage1_bd_controlnet

  model:
    enable_gradient_checkpointing_type: full

  dit_precision: fp32

callbacks:
  grad_clip:
    _target_: fastvideo.train.callbacks.grad_clip.GradNormClipCallback
    max_grad_norm: 1.0

pipeline:
  flow_shift: 5
